[project]
name = "techchallenge3"
version = "0.1.0"
description = "Tech Challenge Fase 3 — classificador de texto médico (NLP) com CI/CD, monitoramento e otimização de latência"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mlflow>=3.15.1",
    "onnxruntime>=1.31.0",
    "pandas>=2.3.3",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.0",
    "skl2onnx>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
